<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Review Carousel</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="review-card">
        <div class="img-container">
            <img id="person-img" src="" alt="Profile picture">
        </div>

        <h4 id="author"></h4>
        <p id="job"></p>
        <p id="info"></p>


        <div class="btn-container">

            <button class="nav-btn" id="prev-btn" aria-label="Previous review">&#10094</button>

            <button class="nav-btn" id="next-btn" aria-label="Next review">&#10095</button>
        </div>

        <button class="random-btn" id="random-btn">Surprise Me</button>

    </main>

    <script src="app.js"></script>
</body>

</html>
