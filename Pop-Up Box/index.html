<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal Pop-Up Box</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <button id="open-modal">Open Modal</button>

    <div id="modal-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">

        <div class="modal-box">
            <div class="modal-header">
                <h3 id="modal-title">Confirm Action</h3>
                <button id="close-modal-btn" class="close-btn" aria-label="Close dialog">&times;</button>
            </div>

            <div class="modal-body">
                <p>This is an overlay dialog. You can close this modal by clicking the "×" button, clicking anywhere outside this box on the overlay, or pressing the <strong>Escape</strong> key.</p>
            </div>

            <div class="modal-footer">
                <button id="cancel-btn" class="btn secondary">Cancel</button>
                <button class="btn primary">Confirm</button>
            </div>

        </div>

    </div>

    <script src="app.js"></script>
</body>

</html>
