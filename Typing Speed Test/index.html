<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Speed Test</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="test-card">
        <header class="stats-bar">

            <div class="stat-item">
                <span class="label">Time Left</span>
                <span id="timer" class="value">60s</span>
            </div>

            <div class="stat-item">
                <span class="label">WPM</span>
                <span id="wpm" class="value">0</span>
            </div>

            <div class="stat-item">
                <span class="label">Accuracy</span>
                <span id="accuracy" class="value">100%</span>
            </div>
        </header>

        <div id="quote-display" class="quote-box"></div>

        <textarea 
        id="input-field"
        placeholder="Start typing here to begin the test..."
        rows="3"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"></textarea>

        <div class="footer">
            <button id="restart-btn" class="btn">Restart Test</button>
        </div>
    </main>

    <script src="app.js"></script>
</body>

</html>
