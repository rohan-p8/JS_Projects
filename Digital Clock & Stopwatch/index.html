<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock & Stopwatch</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="dashboard">
        <section class="card clock-card">
            <h2>Local Time</h2>
            <div id="clock-display" class="display-text">
                00:00:00
            </div>

            <p id="date-display" class="sub-text">
                Loading date...
            </p>
        </section>

        <section class="card stopwatch-card">
            <h2>Stopwatch</h2>
            <div id="stopwatch-display" class="display-text">
                00:00:00<span class="ms">.00</span>
            </div>

            <div class="controls">
                <button id="start-btn" class="btn primary">Start</button>
                <button id="pause-btn" class="btn secondary" disabled>Pause</button>
                <button id="split-btn" class="btn accent" disabled>Split</button>
                <button id="reset-btn" class="btn danger" disabled>Reset</button>
            </div>

            <div class="laps-container">
                <ul id="laps-list"></ul>
            </div>
        </section>

    </main>

    <script src="app.js"></script>
</body>

</html>
