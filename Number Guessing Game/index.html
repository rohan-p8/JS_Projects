<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="game-card">
        <h2>Guess The Number</h2>

        <p class="subtitle">Pick a number between<strong>1 and 100</strong>.</p>


        <form id="guess-form" novalidate>
            <div class="input-group">
                <input type="number" id="guess-input" placeholder="Enter 1-100" min="1" max="100" required autocomplete="off" />

                <button type="submit" id="submit-btn" class="btn primary">Guess</button>

            </div>

        </form>

        <div id="feedback" class="feedback-msg">Make your first guess!</div>


        <div class="stats-panel">

            <p>Attempts:<span id="attempts-count">0</span>/ 10</p>

            <p>Previous Guesses: <span id="guesses-history">None</span></p>
        </div>


        <button id="restart-btn" class="btn secondary hidden">Play Again</button>

    </main>

    <script src="app.js"></script>
</body>

</html>
