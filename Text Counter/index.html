<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Counter</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <div class="card">
            <label for="input" class="title">Your Message</label>

            <textarea id="input" rows="5" maxlength="100" placeholder="Type something here"></textarea>

            <div class="meta">
                <span id="counter">0/100</span>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
