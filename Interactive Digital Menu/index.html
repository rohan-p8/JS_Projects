<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Digital Menu</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="menu-selection">
        <div class="title">
            <h2>Our Menu</h2>
            <div class="underline"></div>
        </div>

        <div class="btn-container">
            <button class="filter-btn active" data-category="all">All</button>
            <button class="filter-btn" data-category="all">Breakfast</button>
            <button class="filter-btn" data-category="all">Lunch</button>
            <button class="filter-btn" data-category="all">Shakes</button>
            <button class="filter-btn" data-category="all">Dinner</button>
        </div>

        <div class="menu-grid" id="menu-grid"></div>

    </main>

    <script src="app.js"></script>
</body>

</html>
